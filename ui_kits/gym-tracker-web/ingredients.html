                <span key={l} style={{flex:1,minWidth:'fit-content',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:4,fontSize:11,fontFamily:'var(--font-mono)',color:'var(--text-2)',background:'var(--bg-subtle)',borderRadius:6,padding:'4px 0'}}>
                  <span style={{width:6,height:6,borderRadius:2,background:col}}></span>{l} {v}g</span>)}
            </div>
          </div>
        </Card>
      </div>

      <div style={{display:'flex',alignItems:'center',gap:12,paddingBottom:40}}>
        <Select options={['12 per page','24 per page','48 per page']} style={{width:130}}/>
        <span style={{flex:1}}></span>
        <Button variant="secondary" size="sm" icon={ic('arrow-left',14)}></Button>
        <Button variant="primary" size="sm">1</Button>
        <Button variant="ghost" size="sm">2</Button>
        <Button variant="ghost" size="sm">…</Button>
        <Button variant="ghost" size="sm">16</Button>
        <Button variant="secondary" size="sm" icon={ic('arrow-right',14)}></Button>
      </div>
    </main>
  </div>;
}
window.__dsReady.then(ns=>{({ Button, Card, Badge, Avatar, SideNav, Input, Select }=ns);ReactDOM.createRoot(document.getElementById('root')).render(<App/>)});
</script></body></html>
