<!-- @dsCard group="Gym Tracker Web" viewport="1440x900" subtitle="Redesigned Fitness profile — washes, gradient chips" name="Fitness profile" -->
<!-- @startingPoint section="Screens" subtitle="Redesigned Fitness profile page" viewport="1440x900" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../ds-loader.js"></script>
<style>body{margin:0;background:var(--bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel-app">
let Button, IconButton, Select, Switch, Card, Badge, Tabs, Table, Avatar, Progress, SideNav, StatCard, ProgressRing, MacroBar, WorkoutRow, StreakDots, GoalCard, TrendChart;

const ic = (n, s=16) => <i data-lucide={n} style={{width:s,height:s}}></i>;
const chip = (n, grad) => <span style={{width:36,height:36,borderRadius:9,background:'var(--grad-'+grad+')',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{ic(n,18)}</span>;

function App(){
  const [dark,setDark]=React.useState(false);
  const [nav,setNav]=React.useState('personal');
  const [range,setRange]=React.useState('6M');
  React.useEffect(()=>{document.documentElement.setAttribute('data-theme',dark?'dark':'light')},[dark]);
  React.useEffect(()=>{lucide.createIcons()});
  return <div style={{display:'flex',minHeight:'100vh',fontFamily:'var(--font-sans)'}}>
    <SideNav activeId={nav} onSelect={setNav} style={{position:'sticky',top:0,height:'100vh'}}
      header={<a href="all-screens.html" style={{display:'block',padding:'4px 12px 16px'}}><img src="../../assets/Logo.svg" alt="Gym Tracker" style={{height:34,display:'block'}}/></a>}
      items={[
        {id:'dash',href:'dashboard.html',label:'Dashboard',icon:ic('layout-dashboard')},
        {id:'personal',href:'index.html',label:'Personal info',icon:ic('heart-pulse')},
        {id:'weight',href:'weight-loss.html',label:'Weight loss',icon:ic('scale')},
        {id:'steps',href:'steps.html',label:'Steps',icon:ic('footprints')},
        {id:'workouts',label:'Workouts',icon:ic('dumbbell'),open:false,children:[{id:'logs',href:'workout-logs.html',label:'Logs'},{id:'exercises',href:'exercises.html',label:'Exercises'}]},
        {id:'macros',href:'macros-dashboard.html',label:'Macros tracker',icon:ic('utensils'),children:[{id:'meals',href:'daily-meals.html',label:'Daily meals'},{id:'recipes',href:'recipes.html',label:'Recipes'},{id:'ingredients',href:'ingredients.html',label:'Ingredients'}]}]}
      footer={<div>
        <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10}}>
          <Switch checked={dark} onChange={e=>setDark(e.target.checked)} label={<span style={{fontSize:13,color:'var(--text-2)'}}>Dark mode</span>}/>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderTop:'1px solid var(--border)'}}>
          <Avatar name="John D" size={32}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:500,color:'var(--text-1)'}}>John Doe</div>
            <div style={{fontSize:11,color:'var(--text-3)',overflow:'hidden',textOverflow:'ellipsis'}}>john.doe@gymgoer.com</div>
          </div>
          <span style={{color:'var(--text-3)'}}>{ic('chevrons-up-down',14)}</span>
        </div>
      </div>}/>
    <main style={{flex:1,minWidth:0,padding:'28px 32px',maxWidth:'var(--content-max)',margin:'0 auto',boxSizing:'border-box',width:'100%'}}>
      <header style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:24}}>
        <div style={{flex:1}}>
          <h1 style={{margin:0,fontSize:'var(--text-2xl)',fontWeight:700,color:'var(--text-1)',letterSpacing:'-0.01em'}}>My fitness profile</h1>
          <p style={{margin:'6px 0 0',fontSize:14,color:'var(--text-2)',maxWidth:560}}>Your current stats, progress, and goals in one place. Added Feb 3, 2025.</p>
        </div>
        <Button variant="secondary" icon={ic('sliders-horizontal')}>Edit macros</Button>
        <Button variant="secondary" icon={ic('plus')}>Add goal</Button>
        <Button icon={ic('pencil')}>Edit personal info</Button>
      </header>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4, minmax(0, 1fr))',gap:16,marginBottom:16}}>
        <StatCard gradient="blue" label="Current weight" value="104.8" unit="kg" delta="↓ 6.2 kg"/>
        <StatCard gradient="violet" label="BMI" value="31.07" unit="kg/m²" delta="Obese I" deltaTone="danger"/>
        <StatCard gradient="teal" label="Daily steps" value="8,500" unit="/ 10,000" delta="85 %" deltaTone="primary" footer={<Progress value={85} tone="success"/>}/>
        <StatCard gradient="amber" label="TDEE" value="2,581" unit="kcal" delta="−10 kcal" deltaTone="warning"/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'minmax(0,2fr) minmax(0,1fr)',gap:16,marginBottom:16}}>
        <Card title="Weight trend" icon={chip('trending-down','blue')} action={<Tabs tabs={['3M','6M','1Y']} active={range} onChange={setRange}/>}>
          <div style={{display:'flex',alignItems:'flex-end',gap:16,flexWrap:'wrap',marginBottom:14}}>
            <div>
              <div style={{fontSize:12,color:'var(--text-3)'}}>Current</div>
              <div style={{display:'flex',alignItems:'baseline',gap:6}}>
                <span style={{fontFamily:'var(--font-mono)',fontFeatureSettings:'var(--tnum)',fontSize:'var(--text-stat-lg)',fontWeight:600,color:'var(--text-1)',lineHeight:1}}>104.8</span>
                <span style={{fontSize:13,color:'var(--text-3)'}}>kg</span>
                <Badge tone="success">↓ 6.2 kg</Badge>
              </div>
            </div>
            <div style={{flex:1,minWidth:160}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-3)',marginBottom:5}}>
                <span>111.0 kg start</span><span>95.0 kg goal</span>
              </div>
              <div style={{position:'relative',height:8,borderRadius:999,background:'var(--surface-sunken)'}}>
                <div style={{width:'39%',height:'100%',borderRadius:999,background:'var(--grad-blue)'}}/>
                <span style={{position:'absolute',left:'39%',top:-3,width:14,height:14,marginLeft:-7,borderRadius:'50%',background:'var(--surface)',border:'2.5px solid var(--primary)',boxSizing:'border-box'}}/>
              </div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:6}}>39 % of the way · 9.8 kg to go</div>
            </div>
          </div>
          <TrendChart data={[111,110.4,110.8,109.6,109.1,108.4,108.8,107.6,106.9,106.2,105.6,105.1,104.8]} height={200} grow={true} showDots={true} xLabels={['Feb','Mar','Apr','May','Jun']}/>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4, minmax(0,1fr))',gap:8,marginTop:16}}>
            {[['Avg / week','−0.45','kg','blue'],['Best week','−1.1','kg','green'],['Weeks','17','logged','teal'],['To goal','~22','wk','violet']].map(([l,v,u,g])=>
              <div key={l} style={{background:'var(--wash-'+g+')',border:'1px solid var(--wash-'+g+'-border)',borderRadius:8,padding:'9px 10px'}}>
                <div style={{fontSize:11,color:'var(--text-2)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{l}</div>
                <div style={{fontFamily:'var(--font-mono)',fontFeatureSettings:'var(--tnum)',fontWeight:600,fontSize:15,color:'var(--text-1)',marginTop:2,whiteSpace:'nowrap'}}>{v}<span style={{fontSize:10,fontWeight:400,color:'var(--text-3)'}}> {u}</span></div>
              </div>)}
          </div>
        </Card>

        <div style={{display:'flex',flexDirection:'column',gap:16,minWidth:0}}>
          <div style={{background:'var(--grad-fade), var(--grad-ink)',borderRadius:'var(--radius-lg)',padding:18,color:'var(--on-grad)'}}>
            <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:14}}>
              <ProgressRing value={2571} max={2868} size={86} stroke={8} color="#fff" textColor="#fff" sublabelColor="var(--on-grad-muted)" label="297" sublabel="deficit"/>
              <div style={{flex:'1 1 120px',minWidth:0,overflowWrap:'anywhere'}}>
                <div style={{fontSize:13,fontWeight:600}}>Energy balance</div>
                <div style={{fontSize:12,color:'var(--on-grad-muted)',marginTop:2}}>297 under maintenance</div>
                <Badge style={{background:'oklch(1 0 0 / 0.16)',color:'#fff',marginTop:8}}>Sustainable</Badge>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(2, minmax(0,1fr))',gap:8,marginTop:16}}>
              {[['TDEE','2,581'],['Target','2,571'],['BMR','2,086'],['Base TDEE','2,868']].map(([l,v])=>
                <div key={l} style={{background:'oklch(1 0 0 / 0.08)',borderRadius:7,padding:'7px 9px'}}>
                  <div style={{fontSize:11,color:'var(--on-grad-muted)'}}>{l}</div>
                  <div style={{fontFamily:'var(--font-mono)',fontFeatureSettings:'var(--tnum)',fontWeight:600,fontSize:14,marginTop:1}}>{v}</div>
                </div>)}
            </div>
          </div>

          <Card title="Body metrics" icon={chip('ruler','violet')} action={<IconButton label="Edit">{ic('pencil',15)}</IconButton>} style={{flex:1}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(2, minmax(0,1fr))',gap:8}}>
              {[['Height','189','cm'],['Age','42','yrs'],['Sex','Male',''],['Activity','Light',''],['Step goal','10,000',''],['Workouts','4','/wk'],['Protein','180','g'],['Sleep','7.5','h']].map(([l,v,u])=>
                <div key={l} style={{background:'var(--bg-subtle)',borderRadius:7,padding:'8px 10px'}}>
                  <div style={{fontSize:11,color:'var(--text-2)'}}>{l}</div>
                  <div style={{fontFamily:'var(--font-mono)',fontFeatureSettings:'var(--tnum)',fontWeight:600,fontSize:14,color:'var(--text-1)',marginTop:1}}>{v}{u && <span style={{fontSize:10,fontWeight:400,color:'var(--text-3)'}}> {u}</span>}</div>
                </div>)}
            </div>
          </Card>
        </div>
      </div>

      <div style={{display:'flex',alignItems:'center',gap:10,margin:'24px 0 12px'}}>
        <h2 style={{margin:0,fontSize:'var(--text-xl)',fontWeight:600,color:'var(--text-1)'}}>Goals</h2>
        <Badge tone="primary">4 active</Badge>
        <a href="#" style={{marginLeft:'auto',fontSize:13,fontWeight:500}}>Show previous goals</a>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4, minmax(0, 1fr))',gap:16,marginBottom:16}}>
        <GoalCard title="Weight" current="104.8" target="95.0" unit="kg" progress={38} dateLabel="By Jan 4, 2027"/>
        <GoalCard title="BMI" current="31.07" target="27.0" unit="kg/m²" progress={24} dateLabel="By Mar 1, 2027"/>
        <GoalCard title="BMR" current="2,024" target="1,900" unit="kcal" progress={55} dateLabel="By Dec 1, 2026"/>
        <GoalCard title="BMI class" current="Obese I" target="Overweight" unit="" progress={62} badge={<Badge tone="warning">Overweight</Badge>} dateLabel="By Mar 1, 2027"/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'minmax(0,1.4fr) minmax(0,1fr)',gap:16,paddingBottom:40}}>
        <Card title="Recent workouts" icon={chip('dumbbell','blue')} action={<Button variant="ghost" size="sm">View logs</Button>} style={{padding:'12px 4px'}}>
          <WorkoutRow icon={chip('dumbbell','blue')} title="Upper body strength" meta="Yesterday · 45 min" stats={[{value:'12',label:'sets'},{value:'320',label:'kcal'}]} badge={<Badge tone="success">Done</Badge>} onClick={()=>{}}/>
          <div style={{height:1,background:'var(--border)',margin:'0 16px'}}/>
          <WorkoutRow icon={chip('footprints','green')} title="Morning run" meta="Jun 5 · 32 min" stats={[{value:'4.2',label:'km'},{value:'285',label:'kcal'}]} onClick={()=>{}}/>
          <div style={{height:1,background:'var(--border)',margin:'0 16px'}}/>
          <WorkoutRow icon={chip('dumbbell','blue')} title="Leg day" meta="Jun 3 · 52 min" stats={[{value:'15',label:'sets'},{value:'410',label:'kcal'}]} onClick={()=>{}}/>
        </Card>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <Card title="This week" icon={chip('zap','green')}>
            <StreakDots days={['done','done','missed','done','done','today','missed']} size={24}/>
            <div style={{fontSize:13,color:'var(--text-2)',marginTop:12}}>4 of 5 workout days hit. One more to match last week.</div>
          </Card>
          <Card title="Macros today" icon={chip('utensils','teal')} action={<Button variant="ghost" size="sm">Edit</Button>}>
            <MacroBar segments={[{label:'Protein',value:180,display:'180 g'},{label:'Carbs',value:220,display:'220 g'},{label:'Fat',value:70,display:'70 g'}]}/>
          </Card>
        </div>
      </div>
    </main>
  </div>;
}
window.__dsReady.then(ns=>{({ Button, IconButton, Select, Switch, Card, Badge, Tabs, Table, Avatar, Progress, SideNav, StatCard, ProgressRing, MacroBar, WorkoutRow, StreakDots, GoalCard, TrendChart }=ns);ReactDOM.createRoot(document.getElementById('root')).render(<App/>)});
</script></body></html>
