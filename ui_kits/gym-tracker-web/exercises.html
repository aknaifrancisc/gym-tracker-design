        <Select options={['All equipment','Barbell','Dumbbell','Cable','Machine','Bodyweight']} style={{width:160}}/>

            <image-slot id="ex-0" shape="rect" placeholder="Arnold Shoulder Press — demo image"></image-slot>

            </div>
          </div>
        </Card>
        <Card key="Chest Press" interactive compact style={{padding:0,overflow:'hidden'}}>
          <div style={{position:'relative',height:180,background:'var(--wash-green)',color:'var(--text-3)'}}>

              <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,fontWeight:500,color:'var(--text-2)',background:'var(--surface-sunken)',borderRadius:999,padding:'4px 10px'}}>{ic('cog',12)} Machine</span>

        <span style={{flex:1}}></span>
        <Button variant="secondary" size="sm" icon={ic('arrow-left',14)}></Button>
        {[1,2,3,'…',6].map((p,i)=><Button key={i} variant={p===page?'primary':'ghost'} size="sm" onClick={()=>typeof p==='number'&&setPage(p)}>{p}</Button>)}
        <Button variant="secondary" size="sm" icon={ic('arrow-right',14)}></Button>
      </div>
    </main>
  </div>;
}
window.__dsReady.then(ns=>{({ Button, IconButton, Card, Badge, Tabs, Avatar, SideNav, Input, Select }=ns);ReactDOM.createRoot(document.getElementById('root')).render(<App/>)});
</script></body></html>
