<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="anim-engine.js"></script>
<style>
  html,body{margin:0;height:100%}
  body{background:#141314;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    --accent:#2a69c8;--accent-deep:#1f56a8;--accent-tint:#eaf1fb}
  a{color:#8fb4e6;text-decoration:none}
  a:hover{color:#c9dcf6;text-decoration:underline;text-underline-offset:3px}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){@keyframes riseIn{from{opacity:0}to{opacity:1}}}
</style>
</helmet>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#17161c"></rect><rect x="30" y="30" width="12" height="40" rx="3" fill="#2a69c8"></rect><rect x="46" y="30" width="24" height="16" rx="3" fill="#e0a83a"></rect><rect x="46" y="50" width="24" height="20" rx="3" fill="#f4f1ea"></rect></svg>
</template>

<div style="min-height:100vh;display:flex;flex-direction:column;background:#141314;color:#f4f1ea">

  <header style="flex:none;display:flex;align-items:center;gap:16px;height:58px;padding:0 22px;background:#17161c;border-bottom:1px solid #26242a">
    <img src="assets/logo-mark-blue.svg" alt="Gym Tracker" style="display:block;height:26px;width:26px;flex:none">
    <span style="width:1px;height:18px;background:#312f37"></span>
    <span style="font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.02em">Web prototype</span>
    <span style="font-size:11.5px;color:#8a867e">Click the sidebar to move between screens</span>
    <div style="flex:1"></div>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8a867e">{{ counter }}</span>
    <div style="display:flex;gap:6px">
      <span onClick="{{ prev }}" title="Previous screen" style="width:32px;height:32px;border-radius:9px;background:#1f1d24;border:1px solid #2e2c35;color:#d8d4cc;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:background .14s" style-hover="background:#2a2831">←</span>
      <span onClick="{{ next }}" title="Next screen" style="width:32px;height:32px;border-radius:9px;background:#1f1d24;border:1px solid #2e2c35;color:#d8d4cc;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:background .14s" style-hover="background:#2a2831">→</span>
    </div>
    <a href="{{ currentHref }}" target="_blank" style="display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:600;text-decoration:none">Open screen alone</a>
  </header>

  <div style="flex:none;display:flex;align-items:center;gap:8px;padding:12px 22px;background:#17161c;border-bottom:1px solid #26242a;overflow-x:auto">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="11">
      <div onClick="{{ s.pick }}" style="display:flex;align-items:center;gap:9px;flex:none;background:{{ s.bg }};border:1px solid {{ s.border }};color:{{ s.fg }};border-radius:999px;padding:7px 14px 7px 10px;font-size:12.5px;font-weight:{{ s.weight }};cursor:pointer;transition:background .16s,border-color .16s,color .16s" style-hover="border-color:#4a4655;color:#fff">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ s.numFg }}">{{ s.num }}</span>
        {{ s.name }}
      </div>
    </sc-for>
  </div>

  <div id="gt-proto-stage" style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:22px 22px 30px;overflow:auto">
    <div style="flex:none;width:{{ frameW }};height:{{ frameH }};position:relative;border-radius:16px;overflow:hidden;background:#efece6;box-shadow:0 40px 90px -50px rgba(0,0,0,.9),0 0 0 1px #2a2831">
      <iframe src="{{ currentHref }}" title="{{ currentName }}" style="position:absolute;top:0;left:0;width:{{ vw }};height:{{ vh }};border:0;transform:scale({{ scale }});transform-origin:0 0"></iframe>
    </div>
    <div style="flex:none;display:flex;align-items:center;gap:10px;margin-top:14px;font-size:11.5px;color:#6f6b64">
      <span style="font-family:'JetBrains Mono',monospace">{{ currentFile }}</span>
      <span style="width:1px;height:11px;background:#2e2c35"></span>
      <span>1920 × 1080 · shown at {{ scalePct }}</span>
      <span style="width:1px;height:11px;background:#2e2c35"></span>
      <span>← → to step through screens</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const SCREENS = [
  { name: 'Dashboard', file: 'Dashboard.dc.html' },
  { name: 'Personal info', file: 'Perfonal Info.dc.html' },
  { name: 'Weight loss', file: 'Weight Loss.dc.html' },
  { name: 'Steps & cardio', file: 'Steps.dc.html' },
  { name: 'Strength progress', file: 'Workouts dashboard.dc.html' },
  { name: 'Workout logs', file: 'Workouts > Logs.dc.html' },
  { name: 'Exercise library', file: 'Workouts > Exercise.dc.html' },
  { name: 'Macros tracker', file: 'Macros Tracker.dc.html' },
  { name: 'Daily meals', file: 'Macros Tracker > Daily Meals.dc.html' },
  { name: 'Recipes', file: 'Macros Tracker > Recipes.dc.html' },
  { name: 'Ingredients', file: 'Macros Tracker > Ingredients.dc.html' }
];

const VW = 1920, VH = 1080;

class Component extends DCLogic {
  state = { idx: 0, scale: 1 };

  componentDidMount(){
    try {
      const saved = parseInt(localStorage.getItem('gt-proto-idx') || '', 10);
      if(isFinite(saved) && saved >= 0 && saved < SCREENS.length) this.setState({ idx: saved });
    } catch(e){}
    this._fit = () => {
      const el = document.getElementById('gt-proto-stage');
      if(!el) return;
      const w = el.clientWidth - 44;
      const s = Math.max(.3, Math.min(1, w / VW));
      if(Math.abs(s - this.state.scale) > .002) this.setState({ scale: s });
    };
    this._key = e => {
      if(e.key === 'ArrowRight') this.step(1);
      if(e.key === 'ArrowLeft') this.step(-1);
    };
    this._msg = e => this.onNavMessage(e);
    window.addEventListener('message', this._msg);
    window.addEventListener('resize', this._fit);
    window.addEventListener('keydown', this._key);
    this._fit();
    this._t = setTimeout(this._fit, 300);
  }

  componentWillUnmount(){
    window.removeEventListener('message', this._msg);
    window.removeEventListener('resize', this._fit);
    window.removeEventListener('keydown', this._key);
    if(this._t) clearTimeout(this._t);
  }

  vh(){ return VH; }

  /* in-screen sidebar clicks post up to the shell instead of navigating the iframe */
  onNavMessage(e){
    const d = e && e.data;
    if(!d || d.type !== 'gt-nav' || !d.file) return;
    const j = SCREENS.findIndex(s => s.file === d.file);
    if(j > -1 && j !== this.state.idx) this.go(j);
  }

  go(idx){
    this.setState({ idx });
    try { localStorage.setItem('gt-proto-idx', String(idx)); } catch(e){}
  }

  step(d){
    const n = (this.state.idx + d + SCREENS.length) % SCREENS.length;
    this.go(n);
  }

  renderVals(){
    const idx = this.state.idx, scale = this.state.scale;
    const cur = SCREENS[idx];
    return {
      screens: SCREENS.map((s, i) => {
        const on = i === idx;
        return { name: s.name,
          num: String(i + 1).padStart(2, '0'),
          pick: () => this.go(i),
          bg: on ? 'var(--accent)' : '#1f1d24',
          border: on ? 'var(--accent)' : '#2e2c35',
          fg: on ? '#fff' : '#a8a49b',
          numFg: on ? 'rgba(255,255,255,.6)' : '#6f6b64',
          weight: on ? 600 : 500 };
      }),
      counter: String(idx + 1).padStart(2, '0') + ' / ' + String(SCREENS.length).padStart(2, '0'),
      currentName: cur.name,
      currentFile: cur.file,
      currentHref: encodeURI(cur.file),
      vw: VW + 'px',
      vh: this.vh() + 'px',
      scale: scale.toFixed(4),
      scalePct: Math.round(scale * 100) + '%',
      frameW: Math.round(VW * scale) + 'px',
      frameH: Math.round(this.vh() * scale) + 'px',
      prev: () => this.step(-1),
      next: () => this.step(1)
    };
  }
}
</script>
</body>
</html>
