<!-- @dsCard group="Components" viewport="700x360" subtitle="Card, Badge, Tabs, Table, Avatar, Progress" name="Display" -->
<!DOCTYPE html><html data-scheme="brand" data-theme="light"><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../ds-loader.js"></script>
<style>body{margin:0;padding:16px;background:var(--bg)}</style></head><body><div id="root"></div>
<script type="text/babel-app">
let Card, Badge, Tabs, Table, Avatar, Progress, Button;
function Demo(){
  const [tab,setTab]=React.useState('Week');
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <Badge>Neutral</Badge><Badge tone="primary">Light activity</Badge><Badge tone="success">↓ 6.2 kg</Badge><Badge tone="warning">Overweight</Badge><Badge tone="danger">Obese I</Badge>
      <Tabs tabs={['Week','Month','Year']} active={tab} onChange={setTab}/>
      <Avatar name="John Doe" size={32}/>
    </div>
    <Card title="Weight log" action={<Button variant="ghost" size="sm">View all</Button>}>
      <Table compact columns={[{key:'d',label:'Date'},{key:'w',label:'Weight',align:'right',numeric:true},{key:'c',label:'Change',align:'right'}]}
        rows={[{d:'Jun 6, 2025',w:'104.8 kg',c:<Badge tone="success">↓ 0.4</Badge>},{d:'May 30, 2025',w:'105.2 kg',c:<Badge tone="success">↓ 0.6</Badge>},{d:'May 23, 2025',w:'105.8 kg',c:<Badge tone="danger">↑ 0.2</Badge>}]}/>
      <Progress value={62} style={{marginTop:12}}/>
    </Card>
  </div>;
}
window.__dsReady.then(ns=>{({ Card, Badge, Tabs, Table, Avatar, Progress, Button }=ns);ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>)});
</script></body></html>
