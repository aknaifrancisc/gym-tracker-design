<!-- @dsCard group="Colors" viewport="700x300" subtitle="_brand and _green, light and dark — set on <html>" name="Accent schemes" -->
<!DOCTYPE html><html data-scheme="brand" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

  <div data-scheme="brand" data-theme="light" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px">
    <div style="font:500 11px var(--font-mono);color:var(--text-2)">data-scheme="brand" data-theme="light"</div>
    <div style="display:flex;gap:6px;margin-top:9px">
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-hover)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-subtle);border:1px solid var(--border)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
      <span style="background:var(--primary);color:var(--primary-fg);border-radius:var(--radius-md);padding:6px 12px;font:600 12px var(--font-sans)">Log workout</span>
      <span style="background:var(--primary-subtle);color:var(--primary-subtle-fg);border-radius:var(--radius-sm);padding:4px 9px;font:500 11px var(--font-sans)">Live</span>
      <span style="font:600 15px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-1)">42.60</span>
    </div>
  </div>
  <div data-scheme="brand" data-theme="dark" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px">
    <div style="font:500 11px var(--font-mono);color:var(--text-2)">data-scheme="brand" data-theme="dark"</div>
    <div style="display:flex;gap:6px;margin-top:9px">
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-hover)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-subtle);border:1px solid var(--border)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
      <span style="background:var(--primary);color:var(--primary-fg);border-radius:var(--radius-md);padding:6px 12px;font:600 12px var(--font-sans)">Log workout</span>
      <span style="background:var(--primary-subtle);color:var(--primary-subtle-fg);border-radius:var(--radius-sm);padding:4px 9px;font:500 11px var(--font-sans)">Live</span>
      <span style="font:600 15px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-1)">42.60</span>
    </div>
  </div>
  <div data-scheme="green" data-theme="light" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px">
    <div style="font:500 11px var(--font-mono);color:var(--text-2)">data-scheme="green" data-theme="light"</div>
    <div style="display:flex;gap:6px;margin-top:9px">
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-hover)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-subtle);border:1px solid var(--border)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
      <span style="background:var(--primary);color:var(--primary-fg);border-radius:var(--radius-md);padding:6px 12px;font:600 12px var(--font-sans)">Log workout</span>
      <span style="background:var(--primary-subtle);color:var(--primary-subtle-fg);border-radius:var(--radius-sm);padding:4px 9px;font:500 11px var(--font-sans)">Live</span>
      <span style="font:600 15px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-1)">42.60</span>
    </div>
  </div>
  <div data-scheme="green" data-theme="dark" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px">
    <div style="font:500 11px var(--font-mono);color:var(--text-2)">data-scheme="green" data-theme="dark"</div>
    <div style="display:flex;gap:6px;margin-top:9px">
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-hover)"></div>
      <div style="flex:1;height:34px;border-radius:7px;background:var(--primary-subtle);border:1px solid var(--border)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
      <span style="background:var(--primary);color:var(--primary-fg);border-radius:var(--radius-md);padding:6px 12px;font:600 12px var(--font-sans)">Log workout</span>
      <span style="background:var(--primary-subtle);color:var(--primary-subtle-fg);border-radius:var(--radius-sm);padding:4px 9px;font:500 11px var(--font-sans)">Live</span>
      <span style="font:600 15px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-1)">42.60</span>
    </div>
  </div>
</div></body></html>
