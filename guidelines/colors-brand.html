<!-- @dsCard group="Colors" viewport="700x210" subtitle="Logo blue ramp + green ramp — one is the accent, never both" name="Accent ramps" -->
<!DOCTYPE html><html data-scheme="brand" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}</style></head><body>

<div style="margin-bottom:14px">
  <div style="font:500 11px var(--font-sans);color:var(--text-2);margin-bottom:6px">Brand — logo blue #2A69C8</div>
  <div style="display:flex;gap:8px">
    <div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--brand-50);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">50</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--brand-100);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">100</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--brand-200);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">200</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--brand-300);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">300</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--brand-400);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">400</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--brand-600);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">600</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--brand-700);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">700</div></div>
  </div>
</div>
<div style="margin-bottom:14px">
  <div style="font:500 11px var(--font-sans);color:var(--text-2);margin-bottom:6px">Green — alternative accent</div>
  <div style="display:flex;gap:8px">
    <div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--gr-50);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">50</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--gr-100);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">100</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--gr-200);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">200</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--gr-300);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">300</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--gr-400);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">400</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--gr-500);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">500</div></div><div style="flex:1"><div style="height:40px;border-radius:7px;background:var(--gr-700);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:4px;color:var(--text-3)">700</div></div>
  </div>
</div>
</body></html>
