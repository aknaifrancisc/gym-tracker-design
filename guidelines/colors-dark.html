<!-- @dsCard group="Colors" viewport="700x230" subtitle="Warm charcoal surfaces, hairline borders, no shadows" name="Dark theme surfaces" -->
<!DOCTYPE html><html data-scheme="brand" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}</style></head><body>
<div data-scheme="brand" data-theme="dark" style="background:var(--bg);border-radius:var(--radius-lg);padding:14px">
  <div style="display:flex;gap:8px">
    <div style="flex:1"><div style="height:44px;border-radius:9px;background:var(--bg);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:5px;color:var(--text-2)">canvas</div></div><div style="flex:1"><div style="height:44px;border-radius:9px;background:var(--surface);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:5px;color:var(--text-2)">card</div></div><div style="flex:1"><div style="height:44px;border-radius:9px;background:var(--surface-sunken);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:5px;color:var(--text-2)">sunken</div></div><div style="flex:1"><div style="height:44px;border-radius:9px;background:var(--border);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:5px;color:var(--text-2)">hairline</div></div><div style="flex:1"><div style="height:44px;border-radius:9px;background:var(--primary);border:1px solid var(--border)"></div><div style="font:500 10.5px var(--font-mono);margin-top:5px;color:var(--text-2)">accent</div></div>
  </div>
  <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
    <span style="font:400 13px var(--font-sans);color:var(--text-1)">text-1</span>
    <span style="font:400 13px var(--font-sans);color:var(--text-2)">text-2</span>
    <span style="font:400 13px var(--font-sans);color:var(--text-3)">text-3</span>
    <span style="font:500 11px var(--font-sans);background:var(--success-subtle);color:var(--success-fg);padding:4px 9px;border-radius:7px">success</span>
    <span style="font:500 11px var(--font-sans);background:var(--warning-subtle);color:var(--warning-fg);padding:4px 9px;border-radius:7px">warning</span>
    <span style="font:500 11px var(--font-sans);background:var(--danger-subtle);color:var(--danger-fg);padding:4px 9px;border-radius:7px">danger</span>
  </div>
</div></body></html>
